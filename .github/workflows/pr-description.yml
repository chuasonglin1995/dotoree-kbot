name: PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chuasonglin1995/mastra-agent@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
